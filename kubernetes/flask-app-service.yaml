apiVersion: v1
kind: Service
metadata:
  name: flask-app
spec:
  type: NodePort
  selector:
    app: flask-app  # This should match the labels in your Deployment
  ports:
    - protocol: TCP
      port: 5000        # Service port
      targetPort: 5000  # Container port (adjust if your Flask app uses a different port)
      nodePort: 30000   # Optional: specify a NodePort (30000-32767), or let K8s assign one